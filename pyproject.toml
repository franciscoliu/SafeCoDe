[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safecode"
version = "1.0.0"
description = "SafeCoDe: safety-aware contrastive decoding for multimodal large language models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Zheyuan Liu" }]
keywords = ["multimodal", "safety", "contrastive-decoding", "mllm", "vlm"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.57.0,<6",
    "accelerate>=1.0.0",
    "datasets>=3.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
qwen = ["qwen-vl-utils>=0.0.11"]

[project.urls]
Paper = "https://arxiv.org/abs/2509.19212"
Repository = "https://github.com/franciscoliu/SafeCoDe"

[project.scripts]
safecode = "safecode.main:main"

[tool.setuptools]
packages = ["safecode", "benchmarks"]
